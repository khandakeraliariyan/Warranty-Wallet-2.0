openapi: 3.1.0
info:
  title: Warranty Wallet API
  version: 2.0.0
  summary: Warranty, purchase-document, claim, and subscription management API
  description: |
    HTTP API used by the Warranty Wallet Next.js application.

    Protected operations use Firebase ID tokens. The API verifies the token,
    resolves the synchronized PostgreSQL user, and then applies account status,
    role, ownership, and plan rules.

    Examples contain fictional identifiers and must not be treated as credentials.
  contact:
    name: Warranty Wallet maintainers
    url: https://github.com/SamiunAuntor/Warranty-Wallet-2.0
  license:
    name: ISC
    identifier: ISC
servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Production placeholder
tags:
  - name: Health
    description: Process health and readiness.
  - name: Users
    description: Firebase identity synchronization, profile, avatar, and preferences.
  - name: Categories
    description: Public category catalog and administrator maintenance.
  - name: Brands
    description: Public brand catalog and administrator maintenance.
  - name: Assets
    description: User-owned purchased products and warranty state.
  - name: Documents
    description: Purchase records, warranty evidence, and condition media.
  - name: AI
    description: Assisted invoice-field extraction with Gemini.
  - name: Claims
    description: Warranty claims, evidence attachments, and timeline events.
  - name: Notifications
    description: User notification inbox and administrator broadcasts.
  - name: Activities
    description: Auditable user and administrator activity records.
  - name: Payments
    description: Plans, Stripe Checkout, payments, and subscriptions.
  - name: Dashboard
    description: User and administrator analytics.
  - name: Admin
    description: Platform administration protected by the ADMIN role.
  - name: Reports
    description: PDF and Excel exports.
  - name: Webhooks
    description: Signed provider callback endpoints.
  - name: Operations
    description: Scheduler and maintenance operations.
