/users/sync:
  post:
    tags: [Users]
    operationId: syncUser
    summary: Synchronize a Firebase identity
    description: |
      Verifies the Firebase bearer token and creates or updates the matching
      application user. UID, email, and verification state come from the token.
    security:
      - FirebaseBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 2
              photoURL:
                type: string
                format: uri
          example:
            name: Demo User
            photoURL: https://example.com/avatar.png
    responses:
      '200':
        description: Existing user synchronized.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, const: true }
                statusCode: { type: integer, const: 200 }
                message: { type: string }
                data: { $ref: ../components/schemas.yaml#/User }
      '201':
        description: Application user created.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, const: true }
                statusCode: { type: integer, const: 201 }
                message: { type: string }
                data: { $ref: ../components/schemas.yaml#/User }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/profile:
  get:
    tags: [Users]
    operationId: getProfile
    summary: Read the authenticated profile
    security:
      - FirebaseBearer: []
    responses:
      '200':
        description: Current application profile.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, const: true }
                statusCode: { type: integer }
                message: { type: string }
                data: { $ref: ../components/schemas.yaml#/User }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  patch:
    tags: [Users]
    operationId: updateProfile
    summary: Update profile fields
    security:
      - FirebaseBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name:
                type: string
                minLength: 2
                maxLength: 100
              phone:
                type: [string, "null"]
                minLength: 7
                maxLength: 30
          example:
            name: Demo Student
            phone: '+8801700000000'
    responses:
      '200':
        description: Updated profile.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, const: true }
                statusCode: { type: integer }
                message: { type: string }
                data: { $ref: ../components/schemas.yaml#/User }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }

/users/profile/avatar:
  post:
    tags: [Users]
    operationId: updateProfileAvatar
    summary: Upload or replace the profile avatar
    security:
      - FirebaseBearer: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: Avatar uploaded and profile updated.
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
      '413':
        description: Avatar exceeds the upload limit.
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/users/preferences:
  get:
    tags: [Users]
    operationId: getUserPreferences
    summary: Read reminder and regional preferences
    security:
      - FirebaseBearer: []
    responses:
      '200':
        description: Current preferences.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, const: true }
                statusCode: { type: integer }
                message: { type: string }
                data: { $ref: ../components/schemas.yaml#/UserPreference }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }
  patch:
    tags: [Users]
    operationId: updateUserPreferences
    summary: Update reminder and regional preferences
    security:
      - FirebaseBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              warrantyReminders: { type: boolean }
              reminderDays:
                type: array
                minItems: 1
                maxItems: 5
                uniqueItems: true
                items:
                  type: integer
                  minimum: 1
                  maximum: 365
              timezone:
                type: string
                description: Valid IANA timezone.
              currency:
                type: string
                enum: [USD, BDT, EUR, GBP, CAD, AUD]
              dateFormat:
                type: string
                enum: [MMM_D_YYYY, DD_MM_YYYY, MM_DD_YYYY]
          example:
            warrantyReminders: true
            reminderDays: [30, 14, 3]
            timezone: Asia/Dhaka
            currency: BDT
            dateFormat: DD_MM_YYYY
    responses:
      '200':
        description: Preferences updated.
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '401': { $ref: ../components/responses.yaml#/Unauthorized }

