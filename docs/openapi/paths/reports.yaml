/reports/products:
  get:
    $ref: '#/components/pathItems/UserProductReport'
/reports/warranty:
  get:
    $ref: '#/components/pathItems/UserWarrantyReport'
/reports/payments:
  get:
    $ref: '#/components/pathItems/UserPaymentReport'
/reports/admin/users:
  get:
    $ref: '#/components/pathItems/AdminUserReport'
/reports/admin/revenue:
  get:
    $ref: '#/components/pathItems/AdminRevenueReport'
/reports/admin/categories:
  get:
    $ref: '#/components/pathItems/AdminCategoryReport'

components:
  parameters:
    Format:
      name: format
      in: query
      required: true
      schema: { type: string, enum: [EXCEL, PDF] }
    Status:
      name: status
      in: query
      schema: { type: string, enum: [ACTIVE, EXPIRING_SOON, EXPIRED] }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
  responses:
    Report:
      description: Generated report file.
      headers:
        Content-Disposition:
          description: Attachment filename generated by the report controller.
          schema: { type: string }
      content:
        application/pdf:
          schema: { type: string, format: binary }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
  pathItems:
    UserProductReport:
      tags: [Reports]
      operationId: exportProductsReport
      summary: Export owned asset data
      security: [{ FirebaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: ../components/responses.yaml#/BadRequest }
        '401': { $ref: ../components/responses.yaml#/Unauthorized }
    UserWarrantyReport:
      tags: [Reports]
      operationId: exportWarrantyReport
      summary: Export owned warranty data
      security: [{ FirebaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: ../components/responses.yaml#/BadRequest }
        '401': { $ref: ../components/responses.yaml#/Unauthorized }
    UserPaymentReport:
      tags: [Reports]
      operationId: exportPaymentsReport
      summary: Export owned payment history
      security: [{ FirebaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: ../components/responses.yaml#/BadRequest }
        '401': { $ref: ../components/responses.yaml#/Unauthorized }
    AdminUserReport:
      tags: [Reports, Admin]
      operationId: exportAdminUsersReport
      summary: Export platform user data
      security: [{ FirebaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: ../components/responses.yaml#/BadRequest }
        '401': { $ref: ../components/responses.yaml#/Unauthorized }
        '403': { $ref: ../components/responses.yaml#/Forbidden }
    AdminRevenueReport:
      tags: [Reports, Admin]
      operationId: exportAdminRevenueReport
      summary: Export platform revenue data
      security: [{ FirebaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: ../components/responses.yaml#/BadRequest }
        '401': { $ref: ../components/responses.yaml#/Unauthorized }
        '403': { $ref: ../components/responses.yaml#/Forbidden }
    AdminCategoryReport:
      tags: [Reports, Admin]
      operationId: exportAdminCategoriesReport
      summary: Export category performance data
      security: [{ FirebaseBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: ../components/responses.yaml#/BadRequest }
        '401': { $ref: ../components/responses.yaml#/Unauthorized }
        '403': { $ref: ../components/responses.yaml#/Forbidden }

